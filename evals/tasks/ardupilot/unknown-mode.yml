id: ardupilot-unknown-mode
fixture: ../../fixtures/robotics-tasks
base_ref: HEAD
prompt: Render an empty ArduPilot mode as UNKNOWN while leaving non-empty modes unchanged. Run the regression test.
acceptance:
  test_commands: [node test/ardupilot-mode.test.js]
  diff_policy:
    allowed_paths: [src/ardupilot-mode.js]
    max_files_changed: 1
    max_added_lines: 1
    max_deleted_lines: 1
fake_actions:
  - tool: patch
    patch: |
      --- a/src/ardupilot-mode.js
      +++ b/src/ardupilot-mode.js
      @@ -1,3 +1,3 @@
       export function displayMode(mode) {
      -  return mode;
      +  return mode || "UNKNOWN";
       }
