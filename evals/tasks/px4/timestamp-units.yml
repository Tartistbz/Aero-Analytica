id: px4-timestamp-units
fixture: ../../fixtures/robotics-tasks
base_ref: HEAD
prompt: Fix the PX4 ULog timestamp conversion so a microsecond value is converted to seconds, not milliseconds. Run the regression test.
acceptance:
  test_commands: [node test/px4-timestamp.test.js]
  diff_policy:
    allowed_paths: [src/px4-timestamp.js]
    max_files_changed: 1
    max_added_lines: 1
    max_deleted_lines: 1
fake_actions:
  - tool: patch
    patch: |
      --- a/src/px4-timestamp.js
      +++ b/src/px4-timestamp.js
      @@ -1,3 +1,3 @@
       export function microsecondsToSeconds(microseconds) {
      -  return microseconds / 1_000;
      +  return microseconds / 1_000_000;
       }
