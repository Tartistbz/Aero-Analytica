id: px4-actuator-clamp
fixture: ../../fixtures/robotics-tasks
base_ref: HEAD
prompt: Clamp normalized PX4 actuator output to the inclusive range [0, 1]. Run the regression test.
acceptance:
  test_commands: [node test/px4-actuator.test.js]
  diff_policy:
    allowed_paths: [src/px4-actuator.js]
    max_files_changed: 1
    max_added_lines: 1
    max_deleted_lines: 1
fake_actions:
  - tool: patch
    patch: |
      --- a/src/px4-actuator.js
      +++ b/src/px4-actuator.js
      @@ -1,3 +1,3 @@
       export function clampActuator(value) {
      -  return value;
      +  return Math.min(1, Math.max(0, value));
       }
